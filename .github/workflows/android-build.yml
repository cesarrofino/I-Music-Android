name: Compilar I-Musica Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'I-Music-Android.zip'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Obter ficheiros do repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Extrair ZIP do Projeto
        run: |
          if [ -f "I-Music-Android.zip" ]; then
            echo "A descompactar I-Music-Android.zip..."
            unzip -o I-Music-Android.zip -d extracted_project
          else
            echo "Erro: I-Music-Android.zip nao encontrado!"
            exit 1
          fi

      - name: Garantir gradlew e Compilar APK
        run: |
          # Encontrar a pasta do projeto Android dentro de extracted_project
          PROJECT_DIR=$(find extracted_project -name "build.gradle.kts" -o -name "build.gradle" | head -n 1 | xargs dirname)
          
          if [ -z "$PROJECT_DIR" ]; then
            echo "Erro: Pasta do projeto Gradle nao encontrada."
            exit 1
          fi
          
          cd "$PROJECT_DIR"
          echo "Diretorio do projeto: $(pwd)"
          
          # Se o gradlew nao existir no ZIP, criamo-lo automaticamente usando o Gradle instalado no servidor
          if [ ! -f "gradlew" ]; then
            echo "gradlew nao encontrado no ZIP. A gerar wrapper do Gradle..."
            gradle wrapper
          fi
          
          chmod +x gradlew
          
          echo "A compilar o APK (assembleDebug)..."
          ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            **/build/outputs/apk/debug/*.apk
            **/app/build/outputs/apk/debug/*.apk
