
name: Compilar I-Musica Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'I-Music-Android.zip'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Obter ficheiros do repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Procurar e extrair projeto ZIP se existir
        run: |
          if [ -f "I-Music-Android.zip" ]; then
            echo "A extrair I-Music-Android.zip..."
            unzip -q I-Music-Android.zip -d extracted_project
          else
            mkdir -p extracted_project
            cp -r * extracted_project/ 2>/dev/null || true
          fi

      - name: Localizar pasta com gradlew e Compilar APK
        run: |
          # Encontrar a pasta exata que contém o gradlew
          GRADLEW_PATH=$(find . -name "gradlew" -type f | head -n 1)
          
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Erro: ficheiro gradlew nao encontrado em nenhum sitio do projeto."
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "Encontrado gradlew em: $PROJECT_DIR"
          
          cd "$PROJECT_DIR"
          chmod +x gradlew
          
          echo "A compilar o APK (assembleDebug)..."
          ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            **/build/outputs/apk/debug/*.apk
            **/app/build/outputs/apk/debug/*.apk
