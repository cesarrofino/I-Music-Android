name: Compilar I-Musica Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'I-Music-Android.zip'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Obter ficheiros do repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Listar e extrair ZIP
        run: |
          echo "=== Ficheiros na raiz do repositorio ==="
          ls -la
          
          if [ -f "I-Music-Android.zip" ]; then
            echo "A descompactar I-Music-Android.zip..."
            unzip -o I-Music-Android.zip -d extracted_project
            echo "=== Conteudo da pasta extraida ==="
            ls -la extracted_project
          else
            echo "Ficheiro ZIP nao encontrado na raiz!"
            exit 1
          fi

      - name: Localizar pasta com gradlew e Compilar APK
        run: |
          # Procurar o gradlew dentro da pasta extraida
          GRADLEW_PATH=$(find extracted_project -name "gradlew" -type f | head -n 1)
          
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Erro: ficheiro gradlew nao encontrado apos descompactar."
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "Encontrado gradlew em: $PROJECT_DIR"
          
          cd "$PROJECT_DIR"
          chmod +x gradlew
          
          echo "A compilar o APK (assembleDebug)..."
          ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            **/build/outputs/apk/debug/*.apk
            **/app/build/outputs/apk/debug/*.apk
